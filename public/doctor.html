<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor - TokenBoard</title>
<link rel="stylesheet" href="app.css">
<style>
  .doc-wrap { padding: 14px; display: grid; gap: 14px; }
  .rooms { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 18px;
    flex: 1;
    min-width: 120px;
    text-align: center;
  }
  .stat b { display: block; font-family: var(--numeral); font-size: 34px; }
  .stat span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1 id="clinic">Clinic</h1>
    <div class="sub" id="doctor"></div>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="clock">--:--</div>
  <button class="btn btn-ghost" id="pause">Pause queue</button>
  <div class="brand"><span class="brand-tile">1</span><span class="brand-name">Token<span class="accent">Board</span></span></div>
</div>

<div class="doc-wrap">
  <div class="summary">
    <div class="stat"><b id="s-wait">0</b><span>Waiting</span></div>
    <div class="stat"><b id="s-room">0</b><span>In rooms</span></div>
    <div class="stat"><b id="s-done">0</b><span>Seen</span></div>
    <div class="stat"><b id="s-avg">-</b><span>Avg wait (min)</span></div>
  </div>

  <div class="rooms" id="rooms"></div>

  <!-- issue a test-room number mid-consult: tap, tell the patient, ✓ Checked -->
  <div class="panel" id="svc-panel" hidden>
    <h2>Send for a test</h2>
    <div id="svc-buttons"></div>
    <div id="svc-result" class="num" style="font-size:44px;text-align:center;min-height:0"></div>
    <div id="svc-note" style="text-align:center;color:var(--muted)"></div>
  </div>

  <div class="panel">
    <h2>Waiting outside</h2>
    <ul class="qlist" id="waiting"></ul>
  </div>

  <div class="panel">
    <h2>End of day</h2>
    <a class="btn" href="/api/report.csv">Download today's list (Excel)</a>
  </div>
</div>

<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

$('pause').onclick = () => CQ.post('/api/pause', { paused: !(CQ.state && CQ.state.paused) });

let svcButtonsDrawn = '';

async function giveService(svc) {
  const res = await CQ.post('/api/token', { kind: 'service', service: svc.id });
  if (res && res.token) {
    $('svc-result').textContent = res.token.label;
    $('svc-note').textContent = 'tell the patient, then go to ' + svc.name;
  }
}

function renderServicePanel(s) {
  $('svc-panel').hidden = s.services.length === 0;
  // the buttons only depend on settings, so redraw only when those change
  const key = JSON.stringify(s.services.map(x => [x.id, x.name, x.color]));
  if (key === svcButtonsDrawn) return;
  svcButtonsDrawn = key;
  const host = $('svc-buttons');
  host.innerHTML = '';
  $('svc-result').textContent = '';
  $('svc-note').textContent = '';
  for (const svc of s.services) {
    const b = document.createElement('button');
    b.className = 'btn-svc';
    b.style.background = svc.color;
    b.innerHTML = esc(svc.name) + ' number <small class="hi">' + esc(svc.nameHi) + '</small>';
    b.onclick = () => giveService(svc);
    host.appendChild(b);
  }
}

CQ.onState(s => {
  $('clinic').textContent = s.clinicName;
  $('doctor').textContent = s.doctorName;
  $('s-wait').textContent = s.stats.waiting;
  $('s-room').textContent = s.stats.inRoom;
  $('s-done').textContent = s.stats.done;
  $('s-avg').textContent = s.stats.avgWait == null ? '-' : s.stats.avgWait;
  $('pause').textContent = s.paused ? 'Resume queue' : 'Pause queue';
  $('pause').classList.toggle('is-paused', s.paused);
  renderServicePanel(s);

  const host = $('rooms');
  host.innerHTML = '';
  for (const room of s.rooms) {
    const t = room.token;
    const card = document.createElement('div');
    card.className = 'room';
    card.innerHTML =
      '<div class="room-head" style="background:' + esc(room.color) + '">' +
        '<span>' + esc(room.name) + '</span>' +
      '</div>' +
      '<div class="room-body">' +
        (t
          ? '<div class="room-token num' + kindCls(t) + '">' + esc(t.label) + '</div>' +
            '<div class="room-meta">inside ' + esc(CQ.waitedMinutes(t.calledAt)) + '</div>' +
            '<button class="btn-done" data-done="' + room.id + '">\u2713 Checked</button>'
          : room.reserved
            ? '<div class="room-empty room-vip">Reserved for VIP</div>'
            : '<div class="room-empty">Empty</div>') +
      '</div>';
    host.appendChild(card);
  }
  host.querySelectorAll('[data-done]').forEach(b =>
    b.onclick = () => CQ.post('/api/done', { room: Number(b.dataset.done) }));

  const w = $('waiting');
  w.innerHTML = '';
  if (!s.waiting.length) {
    w.innerHTML = '<li><div class="empty-note">Nobody is waiting</div></li>';
  } else {
    for (const t of s.waiting) {
      const li = document.createElement('li');
      li.innerHTML =
        '<span class="qnum num' + kindCls(t) + '">' + esc(t.label) + '</span>' +
        kindTag(t) +
        '<span class="qname">waiting ' + esc(CQ.waitedMinutes(t.createdAt)) + '</span>';
      w.appendChild(li);
    }
  }
});

CQ.clock('clock');
CQ.start(2000);
setInterval(() => { if (CQ.state) CQ._emit(); }, 30000);
</script>
</body>
</html>
