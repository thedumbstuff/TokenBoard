<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12263A">
<title>Now serving</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--ink); color: #fff; overflow: hidden; }

  .screen {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
  }

  /* rotating queue-etiquette quotes; a calm strip at the very bottom */
  .d-quote {
    text-align: center;
    padding: 1.4vh 6vw 1.8vh;
    border-top: 1px solid rgba(255, 255, 255, .12);
  }

  .d-quote .q-hi {
    font-family: 'Nirmala UI', sans-serif;
    font-size: clamp(15px, 1.9vw, 28px);
    color: #E8EEF4;
  }

  .d-quote .q-en {
    font-size: clamp(12px, 1.3vw, 20px);
    color: #9DB2C4;
    margin-top: 3px;
  }

  .d-quote.swap { animation: quoteIn .9s ease; }

  @keyframes quoteIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .d-head {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 34px;
    border-bottom: 1px solid rgba(255, 255, 255, .12);
  }

  .d-head h1 {
    font-family: var(--display);
    font-size: clamp(22px, 2.4vw, 40px);
    margin: 0;
    font-weight: 700;
  }

  .d-head .who { color: #9DB2C4; font-size: clamp(13px, 1.2vw, 20px); margin-top: 3px; }
  .d-head .spacer { flex: 1; }
  .d-head .brand { font-size: clamp(15px, 1.6vw, 26px); margin-left: 1vw; }
  .d-head .time { font-family: var(--numeral); font-size: clamp(22px, 2.4vw, 40px); }

  .d-rooms {
    display: grid;
    grid-auto-flow: column;
    /* minmax(0, 1fr), not plain 1fr: a bare 1fr still grows with content,
       so a panel with a wide token or a "next" list would get wider than
       its neighbours. Every room must have exactly the same width. */
    grid-auto-columns: minmax(0, 1fr);
    gap: 3px;
    background: rgba(255, 255, 255, .12);
    min-height: 0;
  }

  .d-room {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2vh 1vw;
    position: relative;
    min-height: 0;
    min-width: 0;
  }

  .d-room .rname {
    font-family: var(--display);
    font-size: clamp(18px, 2.2vw, 40px);
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    opacity: .95;
  }

  .d-room .rname-hi {
    font-family: 'Nirmala UI', sans-serif;
    font-size: clamp(14px, 1.5vw, 26px);
    opacity: .8;
    margin-top: 2px;
  }

  .d-room .rtoken {
    font-family: var(--numeral);
    font-variant-numeric: tabular-nums;
    /* scales with how many panels share the strip (set from JS), so a
       three-character token still fits its equal-width column */
    font-size: clamp(56px, calc(52vw / var(--panels, 3)), 240px);
    line-height: .95;
    margin: 1.5vh 0;
  }

  .d-room .rempty {
    font-family: var(--display);
    font-size: clamp(18px, 2vw, 34px);
    opacity: .55;
    margin: 4vh 0;
  }

  .d-room.flash { animation: flash 1s ease-out 3; }

  @keyframes flash {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.55); }
  }

  .d-foot {
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 14px 34px;
    border-top: 1px solid rgba(255, 255, 255, .12);
    min-height: 82px;
  }

  .d-foot .cap {
    font-family: var(--display);
    font-size: clamp(12px, 1vw, 17px);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #9DB2C4;
    white-space: nowrap;
  }

  .nextlist { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; }

  .nextlist span {
    font-family: var(--numeral);
    font-variant-numeric: tabular-nums;
    font-size: clamp(20px, 2.2vw, 38px);
    background: rgba(255, 255, 255, .1);
    border-radius: 10px;
    padding: 4px 16px;
  }

  .nextlist span.is-urgent { background: var(--urgent); }
  .nextlist span.is-appt { background: var(--appt); }
  .nextlist span.is-return { background: var(--amber); }

  /* Missed numbers: dashed outline, deliberately quieter than the solid
     "next" pills - these patients need to see their number and go back to
     the desk, but the queue itself stays the loudest thing on screen. */
  .missedlist { display: flex; gap: 12px; flex-wrap: wrap; }

  .missedlist span {
    font-family: var(--numeral);
    font-variant-numeric: tabular-nums;
    font-size: clamp(20px, 2.2vw, 38px);
    border: 2px dashed rgba(255, 255, 255, .45);
    color: rgba(255, 255, 255, .8);
    border-radius: 10px;
    padding: 4px 16px;
  }

  .waitcount {
    font-family: var(--display);
    font-size: clamp(14px, 1.4vw, 24px);
    color: #9DB2C4;
    white-space: nowrap;
  }

  .startup {
    position: fixed;
    inset: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    z-index: 60;
  }

  .startup h2 { font-family: var(--display); font-size: 34px; margin: 0; }
  .startup p { color: #9DB2C4; font-size: 19px; margin: 0; }
</style>
</head>
<body>

<div class="screen">
  <div class="d-head">
    <div>
      <h1 id="clinic">Clinic</h1>
      <div class="who" id="doctor"></div>
    </div>
    <div class="spacer"></div>
    <div class="time num" id="clock">--:--</div>
    <div class="brand"><span class="brand-tile">1</span><span class="brand-name">Token<span class="accent">Board</span></span></div>
  </div>

  <div class="d-rooms" id="rooms"></div>

  <div class="d-foot">
    <div class="cap">Next<br>अगला</div>
    <div class="nextlist" id="next"></div>
    <div class="cap" id="missed-cap" hidden>Missed<br>छूटे</div>
    <div class="missedlist" id="missed" hidden></div>
    <div class="waitcount" id="waitcount"></div>
  </div>

  <div class="d-quote" id="quote" hidden>
    <div class="q-hi" id="quote-hi"></div>
    <div class="q-en" id="quote-en"></div>
  </div>
</div>

<div class="startup" id="startup">
  <h2>Touch the screen to start</h2>
  <p>This turns on the sound</p>
</div>

<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let soundOn = false;
let known = {};      // roomId -> token label currently shown
let firstPaint = true;

$('startup').onclick = () => {
  soundOn = true;
  CQ.chime();
  $('startup').remove();
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function announce(room, label, s) {
  if (!soundOn) return;
  CQ.chime();
  if (!s.announce) return;   // "beep only": the chime is the announcement
  const spelled = CQ.spellOut(label);
  setTimeout(() => {
    if (s.language === 'hi' || s.language === 'both') {
      CQ.speak('टोकन नंबर ' + spelled + '. कृपया ' + room.nameHi + ' में जाएं.', 'hi-IN');
    }
    if (s.language === 'en' || s.language === 'both') {
      CQ.speak('Token number ' + spelled + '. Please go to ' + room.name + '.', 'en-IN');
    }
  }, 700);
}

CQ.onState(s => {
  $('clinic').textContent = s.clinicName;
  $('doctor').textContent = s.doctorName;

  const host = $('rooms');
  host.innerHTML = '';
  host.style.setProperty('--panels', s.rooms.length + s.services.length);

  for (const room of s.rooms) {
    const div = document.createElement('div');
    div.className = 'd-room';
    div.style.background = room.color;
    const t = room.token;
    // a reserved room is dimmed so nobody waits on it
    if (room.reserved && !t) div.style.filter = 'brightness(.5) saturate(.5)';
    div.innerHTML =
      '<div class="rname">' + esc(room.name) + '</div>' +
      '<div class="rname-hi">' + esc(room.nameHi) + '</div>' +
      (t ? '<div class="rtoken">' + esc(t.label) + '</div>'
         : room.reserved
           ? '<div class="rempty">Unavailable<br>\u0905\u0928\u0941\u092a\u0932\u092c\u094d\u0927</div>'
           : '<div class="rempty">\u2014</div>');
    host.appendChild(div);

    const label = t ? t.label : null;
    if (!firstPaint && label && known[room.id] !== label) {
      div.classList.add('flash');
      announce(room, label, s);
    }
    known[room.id] = label;
  }

  // test rooms (X-ray, lab) share the grid: same panels, own queues
  for (const svc of s.services) {
    const div = document.createElement('div');
    div.className = 'd-room';
    div.style.background = svc.color;
    const t = svc.token;
    div.innerHTML =
      '<div class="rname">' + esc(svc.name) + '</div>' +
      '<div class="rname-hi">' + esc(svc.nameHi) + '</div>' +
      (t ? '<div class="rtoken">' + esc(t.label) + '</div>'
         : '<div class="rempty">—</div>') +
      (svc.next.length
        ? '<div class="rname-hi">next: ' + svc.next.map(esc).join('  ') + '</div>'
        : '');
    host.appendChild(div);

    const key = 'svc' + svc.id;
    const label = t ? t.label : null;
    if (!firstPaint && label && known[key] !== label) {
      div.classList.add('flash');
      announce(svc, label, s);
    }
    known[key] = label;
  }
  firstPaint = false;

  const nx = $('next');
  nx.innerHTML = '';
  s.waiting.slice(0, 8).forEach(t => {
    const sp = document.createElement('span');
    if (t.kind === 'urgent') sp.className = 'is-urgent';
    else if (t.returning) sp.className = 'is-return';
    else if (t.kind === 'appointment') sp.className = 'is-appt';
    sp.textContent = t.label;
    nx.appendChild(sp);
  });
  if (!s.waiting.length) {
    nx.innerHTML = '<span style="background:none;opacity:.5">\u2014</span>';
  }

  // patients who did not answer their call: show the most recent few so
  // someone coming back from the chemist knows to go to the desk
  const ms = $('missed');
  const missed = s.skipped.slice(-4);
  $('missed-cap').hidden = ms.hidden = missed.length === 0;
  ms.innerHTML = '';
  missed.forEach(t => {
    const sp = document.createElement('span');
    sp.textContent = t.label;
    ms.appendChild(sp);
  });

  $('waitcount').textContent = s.stats.waiting + ' waiting'
    + (s.stats.avgWait != null ? '  \u00B7  about ' + s.stats.avgWait + ' min wait' : '');
});

/* Rotating quotes: gentle reasons to trust the queue, plus practical tips.
   The list and the on/off switch live in Settings; this only renders. */
const QUOTE_MS = 3 * 60 * 1000;   // one quote every three minutes
let quoteShown = '';

function rotateQuote() {
  const s = CQ.state;
  const box = $('quote');
  const items = (s && s.quotesEnabled && Array.isArray(s.quotes)) ? s.quotes : [];
  if (!items.length) { box.hidden = true; quoteShown = ''; return; }
  // index derives from the clock, so reloads and every TV agree
  const idx = Math.floor(Date.now() / QUOTE_MS) % items.length;
  const q = items[idx];
  const key = idx + '|' + (q.hi || '') + '|' + (q.en || '');
  if (key === quoteShown) return;
  quoteShown = key;
  box.hidden = false;
  box.classList.remove('swap');
  void box.offsetWidth;             // restart the animation
  $('quote-hi').textContent = q.hi || '';
  $('quote-hi').style.display = q.hi ? '' : 'none';
  $('quote-en').textContent = q.en || '';
  $('quote-en').style.display = q.en ? '' : 'none';
  box.classList.add('swap');
}

CQ.onState(rotateQuote);          // first paint and settings changes
setInterval(rotateQuote, 15000);  // the three-minute tick between polls

CQ.clock('clock');
CQ.start(1500);
</script>
</body>
</html>
